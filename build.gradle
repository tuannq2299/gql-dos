plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    // Provided by Burp at runtime -> compileOnly, no shading needed.
    // Bump to whatever is current: https://github.com/PortSwigger/burp-extensions-montoya-api/releases
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2026.7'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

jar {
    archiveBaseName = 'gql-dos'
    archiveVersion = '1.0'
}
