plugins {
    id 'java'
}

group = 'gqldos'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    // Provided by Burp at runtime -> compileOnly, no shading needed.
    // Bump to whatever is current: https://github.com/PortSwigger/burp-extensions-montoya-api/releases
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2026.7'
}

tasks.withType(JavaCompile).configureEach {
    // release, not sourceCompatibility: guarantees Java 17 bytecode and API
    // surface whichever JDK does the build. Burp's bundled JRE is newer, but
    // targeting 17 keeps the jar loadable on older installs too.
    options.release = 17
    options.encoding = 'UTF-8'
    // serial and this-escape fire on every Swing panel subclass and say nothing
    // useful here: these components are never serialised.
    options.compilerArgs << '-Xlint:all' << '-Xlint:-serial' << '-Xlint:-this-escape'
}

jar {
    archiveBaseName = 'gql-dos'
    archiveVersion = version
}
